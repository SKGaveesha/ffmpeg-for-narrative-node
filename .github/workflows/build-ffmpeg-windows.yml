# Packages an LGPL-only FFmpeg (ffmpeg, ffprobe, ffplay) for 64-bit Windows and publishes
# it as a GitHub release that Navigator's helper downloads on first run.
#
# It fetches BtbN's verified LGPL build (MIT, https://github.com/BtbN/FFmpeg-Builds),
# verifies all three binaries and checks that no GPL/non-free code is present,
# attaches the exact source tarball as required by LGPL, and publishes to
# our repository so customers' helpers can download reliably without depending on third-party uptime.
name: Build FFmpeg for Windows

on:
  workflow_dispatch:
    inputs:
      ffmpeg:
        description: "FFmpeg release version to package, without the n (from https://github.com/FFmpeg/FFmpeg/tags)"
        default: "8.1.3"

permissions:
  contents: read

env:
  # The tag the helper reads (helper/src/core/ffmpeg/install.ts). Keep it fixed:
  # a rebuild replaces the files, so already-shipped helpers keep working.
  RELEASE_TAG: win-ffmpeg-8.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official BtbN LGPL Windows build
        run: |
          curl -fsSL -o ffmpeg-n8.1-win64-lgpl.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip"

      - name: Verify build and license compliance
        run: |
          unzip -l ffmpeg-n8.1-win64-lgpl.zip | grep -E 'bin/(ffmpeg|ffprobe|ffplay)\.exe'
          unzip -p ffmpeg-n8.1-win64-lgpl.zip '*/bin/ffmpeg.exe' > ffmpeg.exe
          if grep -a -E -- '--enable-(gpl|nonfree)' ffmpeg.exe; then
            echo "Error: Found GPL or non-free components in the build!"
            exit 1
          fi
          grep -a -o -m1 -- '--prefix=[^"]*' ffmpeg.exe > configure-line.txt || true
          {
            echo "FFmpeg ${{ inputs.ffmpeg || '8.1.3' }} for Windows x64 (LGPL)"
            echo "Official static build from BtbN/FFmpeg-Builds packaged for Narrative Node"
            echo "Upstream: https://github.com/BtbN/FFmpeg-Builds"
            echo
            echo "configure:"
            cat configure-line.txt
          } > ffmpeg-win64-BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ffmpeg-n8.1-win64-lgpl.zip
            ffmpeg-win64-BUILD-INFO.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The source, for anyone who gets the binary (LGPL)
        run: |
          ver="${{ inputs.ffmpeg }}"
          ver="${ver:-8.1.3}"
          curl -fsSL -o "dist/ffmpeg-${ver}.tar.xz" "https://ffmpeg.org/releases/ffmpeg-${ver}.tar.xz"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FFmpeg ${{ inputs.ffmpeg || '8.1.3' }} for Windows (LGPL)
          body: |
            LGPL-only FFmpeg ${{ inputs.ffmpeg || '8.1.3' }} (ffmpeg, ffprobe, ffplay) for 64-bit Windows, packaged by this repository's workflow.
            `ffmpeg-win64-BUILD-INFO.txt` names the build scripts and the configure line; the FFmpeg source tarball is attached.
            Downloaded by Navigator by Narrative Node on first run, and checked against the checksum GitHub shows for each file.
          files: dist/*
          overwrite_files: true
